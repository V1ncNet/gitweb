our $projectroot = "/srv/repositories";
our $site_name = "gitweb";
our $logo_url = "/";
our $prevent_xss = 1;
push @stylesheets, "static/theme.css";
$feature{'highlight'}{'default'} = [1];
$feature{'avatar'}{'default'} = [''];
$feature{'snapshot'}{'default'} = [];
$feature{'grep'}{'default'} = [0];
$feature{'pickaxe'}{'default'} = [0];
$feature{'blame'}{'default'} = [0];

our @signature_git_config = (
	"gpg.openpgp.program=/usr/local/bin/gpgv-git",
	"gpg.ssh.program=/usr/bin/ssh-keygen",
	"gpg.ssh.allowedSignersFile=/etc/gitweb.d/allowed_signers",
);
my $signatures = $ENV{'GITWEB_SIGNATURES'} // "";
if ($signatures !~ /\A[01]?\z/) {
	$! = 0;
	die "GITWEB_SIGNATURES must be 0 or 1, not \"$signatures\"\n";
}
$feature{'signatures'}{'default'} = [$signatures eq "1" ? 1 : 0];

sub include_config_file {
	my ($file) = @_;
	my $exists = -e $file;
	$! = 0;
	return unless $exists;
	my $result = do $file;
	my $error = $@ || (defined $result ? "" : "$!");
	$! = 0;
	die "$file: $error" if $error;
}

include_config_file("/etc/gitweb-highlight.pl");
include_config_file("/etc/gitweb.d/site.conf");
